<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 176" width="960" height="176" role="img">
  <title>ChainXray inspection workflow</title>
  <desc>Review a wallet request, check the receipt and trace, then save evidence in a local archive.</desc>
  <rect x="1" y="1" width="958" height="174" rx="18" fill="#0e1122" stroke="#353050" stroke-width="2"/>
  <path d="M30 36h31m839 104h30" stroke="#c8afff" stroke-width="3" stroke-linecap="round"/>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="78" y="43" fill="#c8afff" font-size="20" font-weight="700" letter-spacing="3">CHAINXRAY · INVESTIGATION FLOW</text>
    <g fill="#16192e" stroke="#353050" stroke-width="2">
      <rect x="31" y="65" width="270" height="76" rx="11"/>
      <rect x="345" y="65" width="270" height="76" rx="11"/>
      <rect x="659" y="65" width="270" height="76" rx="11"/>
    </g>
    <g fill="none" stroke="#c8afff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M314 103h18m-7-7 7 7-7 7"/>
      <path d="M628 103h18m-7-7 7 7-7 7"/>
    </g>
    <g fill="#f7f4ff" text-anchor="middle" font-size="23" font-weight="650">
      <text x="166" y="111">Wallet request</text>
      <text x="480" y="111">Receipt &amp; trace</text>
      <text x="794" y="111">Local archive</text>
    </g>
